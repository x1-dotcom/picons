name: Sync X1 Picons

on:
  workflow_dispatch:
  push:
    paths:
      - 'sources/**.json'
      - 'tools/sync_sources.py'
      - '.github/workflows/sync-picons.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync approved picon sources
        run: python tools/sync_sources.py

      - name: Validate index
        run: python tools/validate_index.py

      - name: Commit refreshed picons
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No picon changes"
            exit 0
          fi
          git config user.name "x1-picons-bot"
          git config user.email "x1-picons-bot@users.noreply.github.com"
          git add countries data/index.json ATTRIBUTION.md
          git commit -m "Sync current X1 picons"
          git push
