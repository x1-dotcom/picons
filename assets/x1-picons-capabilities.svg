<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="430" viewBox="0 0 1600 430" role="img" aria-label="X1 Picons capability deck"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02060A"/><stop offset=".55" stop-color="#07111A"/><stop offset="1" stop-color="#03080D"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8FB3BF" stroke-opacity=".045"/></pattern></defs><style>g[font-family] > g > text:nth-of-type(1){font-size:11px;letter-spacing:2px}g[font-family] > g > text:nth-of-type(2){font-size:20px;letter-spacing:0}g[font-family] > g > text:nth-of-type(n+3){font-size:13.5px;letter-spacing:0}</style><rect width="1600" height="430" rx="28" fill="url(#bg)"/><rect width="1600" height="430" rx="28" fill="url(#grid)"/><text x="72" y="62" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" letter-spacing="5" fill="#6ED8EA">X1 // VISUAL IDENTITY DATA SURFACE</text><text x="72" y="108" font-family="Arial Black,Arial,sans-serif" font-size="36" fill="#F5FCFF">IDENTITY FIRST. ARTWORK SECOND.</text><path d="M72 134H1528" stroke="#17303A"/><g font-family="Arial,Helvetica,sans-serif"><g transform="translate(72 168)"><rect width="340" height="190" rx="18" fill="#08131B" stroke="#19E8FF" stroke-width="2"/><text x="26" y="42" font-size="12" font-weight="700" letter-spacing="3" fill="#63DDEB">01 / CANONICAL ID</text><text x="26" y="84" font-size="25" font-weight="800" fill="#F5FCFF">STABLE IDENTITY</text><text x="26" y="118" font-size="16" fill="#8FB3BF">ID · country · aliases</text><rect x="28" y="145" width="58" height="34" rx="6" fill="none" stroke="#19E8FF" stroke-width="3"/><text x="42" y="168" font-size="13" font-weight="700" fill="#DFFBFF">ID</text></g><g transform="translate(444 168)"><rect width="340" height="190" rx="18" fill="#08131B" stroke="#36E6B4" stroke-width="2"/><text x="26" y="42" font-size="12" font-weight="700" letter-spacing="3" fill="#67F1C8">02 / SOURCE</text><text x="26" y="84" font-size="25" font-weight="800" fill="#F5FCFF">TRACE THE ARTWORK</text><text x="26" y="118" font-size="16" fill="#8FB3BF">Origin · status · provenance</text><path d="M28 160h70M115 160h70M202 160h44" stroke="#36E6B4" stroke-width="4"/><circle cx="106" cy="160" r="7" fill="#36E6B4"/><circle cx="193" cy="160" r="7" fill="#36E6B4"/></g><g transform="translate(816 168)"><rect width="340" height="190" rx="18" fill="#08131B" stroke="#F0E96A" stroke-width="2"/><text x="26" y="42" font-size="12" font-weight="700" letter-spacing="3" fill="#F6F18A">03 / RIGHTS</text><text x="26" y="84" font-size="25" font-weight="800" fill="#F5FCFF">MAKE RIGHTS EXPLICIT</text><text x="26" y="118" font-size="16" fill="#8FB3BF">Availability ≠ permission</text><rect x="29" y="145" width="58" height="34" rx="6" fill="none" stroke="#F0E96A" stroke-width="3"/><path d="M44 145v-12c0-18 28-18 28 0v12" fill="none" stroke="#F0E96A" stroke-width="3"/></g><g transform="translate(1188 168)"><rect width="340" height="190" rx="18" fill="#08131B" stroke="#4777FF" stroke-width="2"/><text x="26" y="42" font-size="12" font-weight="700" letter-spacing="3" fill="#86A5FF">04 / MATERIALIZE</text><text x="26" y="84" font-size="25" font-weight="800" fill="#F5FCFF">VALIDATE THE ASSET</text><text x="26" y="118" font-size="16" fill="#8FB3BF">Manifest · file · consumer proof</text><circle cx="54" cy="158" r="18" fill="none" stroke="#4777FF" stroke-width="4"/><path d="M45 158l7 7 14-17" fill="none" stroke="#4777FF" stroke-width="4" stroke-linecap="round"/></g></g><text x="800" y="402" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#6FBDCB">IDENTIFY → SOURCE → AUDIT → MATERIALIZE → VALIDATE → PUBLISH WHEN ALLOWED</text></svg>