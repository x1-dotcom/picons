name: Sync X1 Picons

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches:
      - main
    paths:
      - 'sources/*.json'
      - 'tools/sync_sources.py'
      - 'tools/audit_manifests.py'
      - 'tools/coverage_report.py'
      - 'tools/audit_legacy.py'
      - 'tools/promote_migration_status.py'
      - 'tools/validate_index.py'
      - 'data/legacy-migration-pt.json'
      - '.github/workflows/sync-picons.yml'

permissions:
  contents: write

concurrency:
  group: x1-picons-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show source manifests
        run: |
          echo 'Approved source manifests:'
          find sources -maxdepth 1 -type f -name '*.json' -print | sort

      - name: Audit source manifests
        run: python tools/audit_manifests.py

      - name: Sync approved picon sources
        id: sync
        continue-on-error: true
        run: python tools/sync_sources.py

      - name: Generate coverage matrix
        if: always()
        run: python tools/coverage_report.py

      - name: Audit legacy root picons
        if: always()
        run: python tools/audit_legacy.py

      - name: Publish failure diagnostics
        if: steps.sync.outcome == 'failure'
        run: |
          git config user.name 'x1-picons-bot'
          git config user.email 'x1-picons-bot@users.noreply.github.com'
          git add data/sync-report.json data/coverage.json data/legacy-audit.json COVERAGE.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record X1 picon sync failure diagnostics'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo 'Picon synchronization failed; diagnostics, coverage and legacy audit were preserved.'
          exit 1

      - name: Validate index
        if: steps.sync.outcome == 'success'
        run: python tools/validate_index.py

      - name: Promote migration materialization status
        if: steps.sync.outcome == 'success'
        run: python tools/promote_migration_status.py

      - name: Show generated coverage
        if: steps.sync.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          coverage = json.load(open('data/coverage.json', encoding='utf-8'))
          print('Defined channels:', coverage.get('definedTotal', 0))
          print('Materialized assets:', coverage.get('materializedTotal', 0))
          print('Missing assets:', coverage.get('missingTotal', 0))
          print('By country:')
          for row in coverage.get('countries', []):
              print(f"  {row['country']}: defined={row['defined']} materialized={row['materialized']} missing={row['missing']}")
          report = json.load(open('data/sync-report.json', encoding='utf-8'))
          print('Failed sources:', report.get('failed', 0))
          legacy = json.load(open('data/legacy-audit.json', encoding='utf-8'))
          print('Legacy root PNGs:', legacy.get('rootPngCount', 0))
          print('Exact duplicate groups:', len(legacy.get('exactDuplicateGroups', [])))
          print('Visual review groups:', len(legacy.get('visualReviewGroups', [])))
          migration = json.load(open('data/legacy-migration-pt.json', encoding='utf-8'))
          status_counts = Counter(x.get('status') for x in migration.get('mappings', []))
          print('Portugal migration statuses:', dict(sorted(status_counts.items())))
          PY

      - name: Commit refreshed picons
        if: steps.sync.outcome == 'success'
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'No picon changes'
            exit 0
          fi
          git config user.name 'x1-picons-bot'
          git config user.email 'x1-picons-bot@users.noreply.github.com'
          git add countries data/index.json data/sync-report.json data/coverage.json data/legacy-audit.json data/legacy-migration-pt.json ATTRIBUTION.md COVERAGE.md
          git commit -m 'Sync current X1 picons'
          git pull --rebase origin main
          git push origin HEAD:main
