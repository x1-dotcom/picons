name: Sync X1 Picons

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'sources/*.json'
      - 'tools/sync_sources.py'
      - 'tools/validate_index.py'
      - '.github/workflows/sync-picons.yml'

permissions:
  contents: write

concurrency:
  group: x1-picons-sync-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show source manifests
        run: |
          echo 'Approved source manifests:'
          find sources -maxdepth 1 -type f -name '*.json' -print | sort

      - name: Sync approved picon sources
        run: python tools/sync_sources.py

      - name: Validate index
        run: python tools/validate_index.py

      - name: Show generated coverage
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          data = json.load(open('data/index.json', encoding='utf-8'))
          channels = data.get('channels', [])
          print('Total channels:', len(channels))
          print('By country:', dict(sorted(Counter(x['country'] for x in channels).items())))
          PY

      - name: Commit refreshed picons
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'No picon changes'
            exit 0
          fi
          git config user.name 'x1-picons-bot'
          git config user.email 'x1-picons-bot@users.noreply.github.com'
          git add countries data/index.json ATTRIBUTION.md
          git commit -m 'Sync current X1 picons'
          git pull --rebase origin main
          git push origin HEAD:main
